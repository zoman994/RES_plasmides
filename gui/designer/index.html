<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!--
      Favicon = the same PNG the PWA uses, so the browser-tab icon
      matches the installed app icon. Two sizes registered so the
      browser can pick the right resolution (most tabs render
      16-32 px; the 512 PNG is kept as the high-DPI source).
    -->
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/icons/icon-512.png" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f59e0b" />
    <meta name="description" content="BodgeGene — visual constructor for genetic assemblies (plasmids)." />
    <title>BodgeGene</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
