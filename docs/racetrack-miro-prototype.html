<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BodgeGene — Racetrack + MIRO Connector Prototype</title>
<style>
:root {
  --bg1: #ffffff; --bg2: #f7f7f5; --bt: rgba(0,0,0,0.15); --bs: rgba(0,0,0,0.3);
  --t1: #2C2C2A; --t2: #5F5E5A; --t3: #888780; --bi: #378ADD;
  --rad: 8px; --radl: 12px;
}
* { box-sizing: border-box; margin: 0 }
body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; padding: 20px; background: var(--bg2) }
h1 { font-size: 18px; font-weight: 500; margin-bottom: 8px; color: var(--t1) }
p.sub { font-size: 13px; color: var(--t2); margin-bottom: 16px }
.ctrl { display: flex; gap: 8px; align-items: center; margin-bottom: 16px; flex-wrap: wrap }
.ctrl button { font-size: 13px; padding: 4px 12px; border-radius: var(--rad); border: 0.5px solid var(--bs); background: var(--bg1); color: var(--t1); cursor: pointer }
.ctrl button:hover { background: var(--bg2) }
.ctrl span { font-size: 13px; color: var(--t2) }
.stage { position: relative; width: 100%; height: 420px; border-radius: var(--radl); border: 0.5px solid var(--bt); background: var(--bg1); background-image: radial-gradient(var(--bt) 0.5px, transparent 0.5px); background-size: 16px 16px; overflow: visible }
.block { position: absolute; border-radius: 6px; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: all 0.4s cubic-bezier(0.4,0,0.2,1); border: 1.5px solid; gap: 6px; padding: 0 8px }
.block:hover { filter: brightness(0.97) }
.block .nm { font-size: 11px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis }
.block .bp { font-size: 9px; opacity: 0.6 }
.conn { position: absolute; width: 20px; height: 20px; border-radius: 50%; background: var(--bg1); border: 2px solid #94A3B8; cursor: pointer; display: flex; align-items: center; justify-content: center; z-index: 10; transition: all 0.2s }
.conn:hover { border-color: #3B82F6; transform: scale(1.3); background: #EFF6FF }
.conn svg { width: 10px; height: 10px }
.dropdown { position: absolute; z-index: 20; background: var(--bg1); border: 0.5px solid var(--bs); border-radius: 8px; padding: 4px 0; min-width: 200px; max-height: 280px; overflow-y: auto; box-shadow: 0 4px 16px rgba(0,0,0,0.12) }
.dropdown .item { padding: 7px 12px; font-size: 12px; cursor: pointer; display: flex; align-items: center; gap: 8px; color: var(--t1) }
.dropdown .item:hover { background: var(--bg2) }
.dropdown .item .dot { width: 8px; height: 8px; border-radius: 2px; flex-shrink: 0 }
.dropdown .item .info { font-size: 10px; color: var(--t3); margin-left: auto }
.dropdown .search { width: calc(100% - 16px); margin: 4px 8px; font-size: 12px; padding: 5px 8px; border: 0.5px solid var(--bt); border-radius: 4px; outline: none }
.dropdown .search:focus { border-color: var(--bi) }
.dropdown .hdr { padding: 4px 12px; font-size: 10px; color: var(--t3); font-weight: 500; text-transform: uppercase; letter-spacing: 0.05em }
.dropdown .div { height: 1px; background: var(--bt); margin: 4px 0 }
.center-label { position: absolute; text-align: center; pointer-events: none; color: var(--t3) }
.hint { font-size: 12px; color: var(--t2); margin-top: 10px; text-align: center }
</style>
</head>
<body>
<h1>BodgeGene — Racetrack + MIRO Connectors</h1>
<p class="sub">Interactive prototype: click + between blocks to insert fragments from library</p>
<div class="ctrl">
<button onclick="addFrag()">+ Add to end</button>
<button onclick="rmFrag()">- Remove last</button>
<button onclick="toggleCircular()">Toggle circular/linear</button>
<span id="info"></span>
</div>
<div class="stage" id="stage"></div>
<p class="hint">Click the <b>+</b> connector between blocks to insert a fragment. Search by name or type.</p>
<script>
const C={CDS:'#3B82F6',promoter:'#22C55E',terminator:'#F97316',rep_origin:'#A855F7',marker:'#FBBF24'};
const LT={CDS:'#DBEAFE',promoter:'#DCFCE7',terminator:'#FFEDD5',rep_origin:'#F3E8FF',marker:'#FEF9C3'};
const DK={CDS:'#1E40AF',promoter:'#166534',terminator:'#9A3412',rep_origin:'#6B21A8',marker:'#854D0E'};
const LIB=[
{name:'eGFP',type:'CDS',bp:720},{name:'mCherry',type:'CDS',bp:711},{name:'Cas9',type:'CDS',bp:4100},
{name:'HygR',type:'marker',bp:1024},{name:'KanR',type:'marker',bp:816},{name:'AmpR',type:'marker',bp:861},
{name:'P_tef1',type:'promoter',bp:420},{name:'P_glaA',type:'promoter',bp:850},{name:'P_cbh1',type:'promoter',bp:720},
{name:'T_trpC',type:'terminator',bp:567},{name:'T_nos',type:'terminator',bp:350},{name:'T_cyc1',type:'terminator',bp:280},
{name:'pUC ori',type:'rep_origin',bp:600},{name:'ColE1',type:'rep_origin',bp:550},
];
let frags=[
{name:'P_glaA',type:'promoter',bp:850,id:0},{name:'eGFP',type:'CDS',bp:720,id:1},
{name:'T_trpC',type:'terminator',bp:567,id:2},{name:'AmpR',type:'marker',bp:861,id:3},
{name:'pUC ori',type:'rep_origin',bp:600,id:4},
];
let nxt=5,circ=true,openDD=null;
function addFrag(){const p=LIB[Math.floor(Math.random()*LIB.length)];frags.push({...p,id:nxt++});render()}
function rmFrag(){if(frags.length>2){frags.pop();render()}}
function toggleCircular(){circ=!circ;render()}
function render(){
const s=document.getElementById('stage');s.innerHTML='';const n=frags.length;if(!n)return;
const W=s.clientWidth,H=s.clientHeight,total=frags.reduce((a,f)=>a+f.bp,0);
let pos;
if(circ){
const cx=W/2,cy=H/2,rx=W*0.36,ry=H*0.33;let cum=-Math.PI/2;
pos=frags.map(f=>{const fr=f.bp/total,arc=fr*2*Math.PI,mid=cum+arc/2,end=cum+arc,bw=Math.max(55,Math.min(140,fr*W*0.9));const p={x:cx+rx*Math.cos(mid)-bw/2,y:cy+ry*Math.sin(mid)-20,w:bw,h:40,mid,end};cum=end;return p});
const svg=mkSVG(W,H);
for(let i=0;i<n;i++){const p1=pos[i],p2=pos[(i+1)%n],ox=W/2+(rx*0.65)*Math.cos(p1.end),oy=H/2+(ry*0.65)*Math.sin(p1.end);
const l=document.createElementNS('http://www.w3.org/2000/svg','path');l.setAttribute('d',`M${p1.x+p1.w/2},${p1.y+p1.h/2} Q${ox},${oy} ${p2.x+p2.w/2},${p2.y+p2.h/2}`);l.setAttribute('fill','none');l.setAttribute('stroke','#CBD5E1');l.setAttribute('stroke-width','1.5');l.setAttribute('stroke-dasharray','5 3');svg.appendChild(l)}
s.appendChild(svg);
const lb=document.createElement('div');lb.className='center-label';lb.style.cssText=`left:${W/2-70}px;top:${H/2-16}px;width:140px`;lb.innerHTML=`<div style="font-size:14px;font-weight:500">Construct</div><div style="font-size:11px">${(total/1000).toFixed(1)} kb circular</div>`;s.appendChild(lb);
for(let i=0;i<n;i++){const p1=pos[i],p2=pos[(i+1)%n],t=.5,ox=W/2+(rx*.65)*Math.cos(p1.end),oy=H/2+(ry*.65)*Math.sin(p1.end);
const bx=(1-t)*(1-t)*(p1.x+p1.w/2)+2*(1-t)*t*ox+t*t*(p2.x+p2.w/2),by=(1-t)*(1-t)*(p1.y+p1.h/2)+2*(1-t)*t*oy+t*t*(p2.y+p2.h/2);mkConn(s,bx,by,i)}
}else{
const startX=40,y=H/2-20,gap=50,avail=W-80-(n-1)*gap;let cx=startX;
pos=frags.map(f=>{const fr=f.bp/total,bw=Math.max(55,Math.min(160,fr*avail));const p={x:cx,y,w:bw,h:40};cx+=bw+gap;return p});
const svg=mkSVG(W,H);
for(let i=0;i<n-1;i++){const p1=pos[i],p2=pos[i+1],l=document.createElementNS('http://www.w3.org/2000/svg','line');
l.setAttribute('x1',p1.x+p1.w);l.setAttribute('y1',p1.y+p1.h/2);l.setAttribute('x2',p2.x);l.setAttribute('y2',p2.y+p2.h/2);l.setAttribute('stroke','#CBD5E1');l.setAttribute('stroke-width','1.5');l.setAttribute('stroke-dasharray','5 3');svg.appendChild(l)}
s.appendChild(svg);
for(let i=0;i<n-1;i++){const p1=pos[i],p2=pos[i+1];mkConn(s,(p1.x+p1.w+p2.x)/2,p1.y+p1.h/2,i)}
mkConn(s,pos[n-1].x+pos[n-1].w+25,pos[n-1].y+pos[n-1].h/2,n-1);
}
for(let i=0;i<n;i++){const f=frags[i],p=pos[i],el=document.createElement('div');el.className='block';el.style.cssText=`left:${p.x}px;top:${p.y}px;width:${p.w}px;height:${p.h}px;background:${LT[f.type]||'#F1F5F9'};border-color:${C[f.type]||'#94A3B8'}`;el.innerHTML=`<span class="nm" style="color:${DK[f.type]||'#334155'}">${f.name}</span><span class="bp" style="color:${C[f.type]||'#64748B'}">${f.bp}</span>`;s.appendChild(el)}
document.getElementById('info').textContent=`${n} fragments, ${total.toLocaleString()} bp, ${circ?'circular':'linear'}`;
}
function mkSVG(w,h){const s=document.createElementNS('http://www.w3.org/2000/svg','svg');s.setAttribute('width','100%');s.setAttribute('height','100%');s.style.cssText='position:absolute;left:0;top:0;pointer-events:none';return s}
function mkConn(par,x,y,idx){const c=document.createElement('div');c.className='conn';c.style.cssText=`left:${x-10}px;top:${y-10}px`;c.innerHTML='<svg viewBox="0 0 12 12"><line x1="6" y1="2" x2="6" y2="10" stroke="#94A3B8" stroke-width="1.5"/><line x1="2" y1="6" x2="10" y2="6" stroke="#94A3B8" stroke-width="1.5"/></svg>';c.onclick=e=>{e.stopPropagation();showDD(idx,x,y)};par.appendChild(c)}
function showDD(idx,x,y){closeDD();const s=document.getElementById('stage'),dd=document.createElement('div');dd.className='dropdown';dd.id='dd';dd.style.cssText=`left:${Math.min(x+14,s.clientWidth-220)}px;top:${y+14}px`;
const inp=document.createElement('input');inp.className='search';inp.placeholder='Search library...';inp.oninput=()=>fillDD(inp.value,idx);dd.appendChild(inp);
const list=document.createElement('div');list.id='dd-list';fillDD('',idx,list);dd.appendChild(list);
const dv=document.createElement('div');dv.className='div';dd.appendChild(dv);
const imp=document.createElement('div');imp.className='item';imp.innerHTML='<span class="dot" style="background:#94A3B8;border-radius:50%"></span>Import from file...';imp.onclick=()=>closeDD();dd.appendChild(imp);
s.appendChild(dd);openDD=dd;setTimeout(()=>inp.focus(),50)}
function fillDD(q,idx,container){
const c=container||document.getElementById('dd-list');if(!c)return;c.innerHTML='';
const lo=q.toLowerCase(),types=['promoter','CDS','terminator','marker','rep_origin'],labels={promoter:'Promoters',CDS:'Coding',terminator:'Terminators',marker:'Markers',rep_origin:'Origins'};
for(const t of types){const items=LIB.filter(l=>l.type===t&&(l.name.toLowerCase().includes(lo)||t.includes(lo)));
if(!items.length)continue;const h=document.createElement('div');h.className='hdr';h.textContent=labels[t];c.appendChild(h);
items.forEach(lib=>{const it=document.createElement('div');it.className='item';it.innerHTML=`<span class="dot" style="background:${C[lib.type]}"></span>${lib.name}<span class="info">${lib.bp} bp</span>`;it.onclick=()=>{frags.splice(idx+1,0,{...lib,id:nxt++});closeDD();render()};c.appendChild(it)})}
if(!c.children.length){const e=document.createElement('div');e.className='item';e.style.color='var(--t3)';e.textContent='No matches';c.appendChild(e)}}
function closeDD(){if(openDD){openDD.remove();openDD=null}}
document.addEventListener('click',e=>{if(openDD&&!openDD.contains(e.target)&&!e.target.classList.contains('conn'))closeDD()});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeDD()});
render();window.addEventListener('resize',render);
</script>
</body>
</html>
